<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משפחה דואגת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f6fb; --card:#fff; --ink:#151a2d; --muted:#6b7190; --line:#e4e6f0;
  --brand:#5b5bf0; --brand2:#8b5cf6; --brand-soft:#ecebff;
  --ok:#12a26b; --ok-soft:#e3f7ee; --warn:#d97706; --warn-soft:#fff3dc; --bad:#dc3545; --bad-soft:#fde8ea;
  --r:16px; --shadow:0 1px 2px rgba(20,24,60,.05),0 6px 24px rgba(20,24,60,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1220; --card:#171b2e; --ink:#eef0fa; --muted:#9aa0bf; --line:#262b45;
  --brand-soft:#25255a; --ok-soft:#0f3328; --warn-soft:#3b2a0c; --bad-soft:#3d1419; --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);direction:rtl;text-align:right;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* header */
header{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:18px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}
.logo span{background:rgba(255,255,255,.2);border-radius:12px;padding:4px 10px;font-size:20px}
.top .who{display:flex;gap:8px;align-items:center;font-size:14px;opacity:.95;white-space:nowrap;flex-wrap:wrap}
.top select{background:rgba(255,255,255,.18);border:0;border-radius:10px;padding:6px 10px;color:#fff}
.top select option{color:#111}
nav{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:#fff;opacity:.8;padding:10px 14px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap;font-weight:500}
nav button.on{background:var(--bg);color:var(--brand);opacity:1;font-weight:700}
.btn-ghost-w{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer}
main{padding:20px 0 60px}
/* common */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
h2{margin:0 0 14px;font-size:20px} h3{margin:0 0 10px;font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600;background:var(--brand);color:#fff}
.btn.sec{background:var(--brand-soft);color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.okb{background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.item .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .title{font-weight:700;font-size:16px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.list{display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.line.done{opacity:.6}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:3px;background:var(--brand-soft);color:var(--brand);padding:8px 14px;border-radius:12px;display:inline-block;direction:ltr}
a{color:var(--brand)}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(140deg,var(--brand),var(--brand2))}
.auth .card{width:100%;max-width:420px;padding:28px}
.auth h1{margin:0 0 4px;font-size:26px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
.tabs2{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:16px 0 4px}
.tabs2 button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs2 button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.msg{margin-top:12px;font-size:14px;padding:10px;border-radius:10px}
.msg.err{background:var(--bad-soft);color:var(--bad)} .msg.info{background:var(--ok-soft);color:var(--ok)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,12,30,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal .foot{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- AUTH -->
<section id="authView" class="auth hidden">
  <div class="card">
    <h1>👨‍👩‍👧 משפחה דואגת</h1>
    <div class="muted">ניהול משותף של הטיפול בהורים: תרופות, תורים, משימות ומסמכים</div>
    <div class="tabs2"><button id="tLogin" class="on">כניסה</button><button id="tSignup">הרשמה</button></div>
    <form id="authForm">
      <label>אימייל</label><input id="aEmail" type="email" required dir="ltr">
      <label>סיסמה</label><input id="aPass" type="password" required minlength="6" dir="ltr">
      <button class="btn" style="width:100%;margin-top:18px" id="aBtn">כניסה</button>
    </form>
    <div id="authMsg"></div>
  </div>
</section>

<!-- ONBOARD -->
<section id="onboardView" class="auth hidden">
  <div class="card">
    <h1>ברוכים הבאים</h1>
    <div class="muted">צרו מרחב משפחתי חדש, או הצטרפו עם קוד שקיבלתם מאח/אחות</div>
    <label>איך לקרוא לך באפליקציה?</label><input id="oName" placeholder="למשל: שרה">
    <div class="tabs2"><button id="tCreate" class="on">משפחה חדשה</button><button id="tJoin">הצטרפות בקוד</button></div>
    <div id="createBox"><label>שם המשפחה</label><input id="oFamily" placeholder="למשל: משפחת כהן"></div>
    <div id="joinBox" class="hidden"><label>קוד הזמנה</label><input id="oCode" dir="ltr" placeholder="AB12CD34"></div>
    <button class="btn" style="width:100%;margin-top:18px" id="oBtn">יצירה</button>
    <div id="onbMsg"></div>
    <div style="margin-top:14px;text-align:center"><a href="#" id="oLogout" class="small">יציאה</a></div>
  </div>
</section>

<!-- APP -->
<section id="appView" class="hidden">
  <header>
    <div class="wrap">
      <div class="top">
        <div class="logo"><span>💜</span><div><div id="famName">משפחה</div></div></div>
        <div class="who">
          <span>מתמקדים ב:</span>
          <select id="parentFilter"></select>
          <span id="meName"></span>
          <button class="btn-ghost-w" id="logout">יציאה</button>
        </div>
      </div>
      <nav id="nav">
        <button data-tab="today" class="on">היום</button>
        <button data-tab="meds">תרופות</button>
        <button data-tab="appts">תורים</button>
        <button data-tab="tasks">משימות</button>
        <button data-tab="contacts">אנשי קשר</button>
        <button data-tab="docs">מסמכים</button>
        <button data-tab="family">המשפחה</button>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main"></main>
</section>

<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
// ---------- config ----------
const SUPABASE_URL = 'https://jyablpbzjopfjorernqe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Uo9ckbmnZyChWz8LpbFwjA_HYzBKH_A';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- state ----------
const S = { user:null, family:null, me:null, members:[], parents:[], meds:[], logs:[], appts:[], tasks:[], contacts:[], docs:[], tab:'today', parent:'all', apptFilter:'upcoming', taskFilter:'open' };

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = id => ['authView','onboardView','appView'].forEach(v => $('#'+v).classList.toggle('hidden', v!==id));
const pad = n => String(n).padStart(2,'0');
const localDate = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDate = s => s ? new Date(s.length===10 ? s+'T00:00' : s).toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'}) : '';
const fmtDT = s => s ? new Date(s).toLocaleString('he-IL',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
const daysUntil = s => Math.ceil((new Date(s+'T00:00') - new Date(localDate()+'T00:00'))/864e5);
const memberName = id => S.members.find(m=>m.user_id===id)?.display_name || '';
const parentName = id => S.parents.find(p=>p.id===id)?.full_name || '';
const byParent = arr => S.parent==='all' ? arr : arr.filter(x => x.parent_id===S.parent);
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.add('hidden'),2200); }
function msg(el, text, kind='err'){ $(el).innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ''; }
function errText(e){ const m=e?.message||String(e); if(/Invalid login/i.test(m)) return 'אימייל או סיסמה שגויים'; if(/Email not confirmed/i.test(m)) return 'צריך לאשר את המייל קודם — בדקו את תיבת הדואר'; if(/already registered/i.test(m)) return 'המייל הזה כבר רשום — נסו להיכנס'; return m; }

// ---------- auth ----------
let authMode='login';
function setAuthMode(m){ authMode=m; $('#tLogin').classList.toggle('on',m==='login'); $('#tSignup').classList.toggle('on',m==='signup'); $('#aBtn').textContent = m==='login'?'כניסה':'הרשמה'; msg('#authMsg',''); }
$('#tLogin').onclick=()=>setAuthMode('login'); $('#tSignup').onclick=()=>setAuthMode('signup');
$('#authForm').onsubmit = async e => {
  e.preventDefault(); const email=$('#aEmail').value.trim(), password=$('#aPass').value;
  $('#aBtn').disabled=true;
  try{
    if(authMode==='login'){ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; }
    else {
      const opts = location.protocol.startsWith('http') ? {emailRedirectTo: location.origin+location.pathname} : {};
      const {data,error}=await sb.auth.signUp({email,password,options:opts}); if(error) throw error;
      if(!data.session) msg('#authMsg','נשלח אליך מייל אישור. אחרי האישור חזרו לכאן והיכנסו.','info');
    }
  }catch(err){ msg('#authMsg', errText(err)); }
  $('#aBtn').disabled=false;
};
async function logout(){ await sb.auth.signOut(); }
$('#logout').onclick=logout; $('#oLogout').onclick=e=>{e.preventDefault();logout();};

// ---------- onboarding ----------
let onbMode='create';
function setOnb(m){ onbMode=m; $('#tCreate').classList.toggle('on',m==='create'); $('#tJoin').classList.toggle('on',m==='join'); $('#createBox').classList.toggle('hidden',m!=='create'); $('#joinBox').classList.toggle('hidden',m!=='join'); $('#oBtn').textContent=m==='create'?'יצירה':'הצטרפות'; }
$('#tCreate').onclick=()=>setOnb('create'); $('#tJoin').onclick=()=>setOnb('join');
$('#oBtn').onclick = async () => {
  const name=$('#oName').value.trim(); if(!name) return msg('#onbMsg','נא למלא שם');
  try{
    if(onbMode==='create'){ const fam=$('#oFamily').value.trim(); if(!fam) return msg('#onbMsg','נא למלא שם משפחה');
      const {error}=await sb.rpc('create_family',{p_name:fam,p_display_name:name}); if(error) throw error; }
    else { const code=$('#oCode').value.trim(); if(!code) return msg('#onbMsg','נא להזין קוד');
      const {error}=await sb.rpc('join_family',{p_code:code,p_display_name:name}); if(error) throw error; }
    await boot();
  }catch(e){ msg('#onbMsg', errText(e)); }
};

// ---------- data ----------
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  S.user = session?.user || null;
  if(!S.user) return show('authView');
  const {data:mem, error} = await sb.from('family_members').select('family_id, display_name, role, families(*)').eq('user_id', S.user.id).order('joined_at').limit(1);
  if(error){ console.error(error); }
  if(!mem || !mem.length) return show('onboardView');
  S.family = mem[0].families; S.me = mem[0];
  $('#famName').textContent = S.family.name; $('#meName').textContent = '· ' + S.me.display_name;
  show('appView');
  await loadAll(); render();
}
async function loadAll(){
  const f = S.family.id;
  const q = (t, order, asc=true) => sb.from(t).select('*').eq('family_id', f).order(order,{ascending:asc});
  const since = new Date(Date.now()-14*864e5);
  const [members, parents, meds, logs, appts, tasks, contacts, docs] = await Promise.all([
    q('family_members','joined_at'), q('parents','created_at'), q('medications','name'),
    sb.from('medication_logs').select('*').eq('family_id',f).gte('scheduled_date', localDate(since)),
    q('appointments','starts_at'), q('tasks','created_at',false), q('contacts','name'), q('documents','created_at',false)
  ]);
  for(const r of [members,parents,meds,logs,appts,tasks,contacts,docs]) if(r.error) console.error(r.error);
  Object.assign(S,{members:members.data||[],parents:parents.data||[],meds:meds.data||[],logs:logs.data||[],appts:appts.data||[],tasks:tasks.data||[],contacts:contacts.data||[],docs:docs.data||[]});
  const pf=$('#parentFilter');
  pf.innerHTML = `<option value="all">כל ההורים</option>` + S.parents.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('');
  if(S.parent!=='all' && !S.parents.some(p=>p.id===S.parent)) S.parent='all';
  pf.value=S.parent;
}
$('#parentFilter').onchange = e => { S.parent=e.target.value; render(); };
$('#nav').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); };
async function refresh(){ await loadAll(); render(); }
window.addEventListener('focus', ()=>{ if(S.family) refresh(); });

// ---------- generic form/modal ----------
const parentOpts = (optional) => (optional?[{v:'',t:'— כללי / שניהם —'}]:[]).concat(S.parents.map(p=>({v:p.id,t:p.full_name})));
const memberOpts = () => [{v:'',t:'— לא משויך —'}].concat(S.members.map(m=>({v:m.user_id,t:m.display_name})));
const ENT = {
  parents:{ title:'הורה', fields:()=>[
    {k:'full_name',l:'שם מלא',req:1},{k:'birth_date',l:'תאריך לידה',type:'date'},{k:'hmo',l:'קופת חולים',type:'select',opts:['','כללית','מכבי','מאוחדת','לאומית'].map(v=>({v,t:v||'—'}))},
    {k:'conditions',l:'מצבים רפואיים / אבחנות',type:'textarea'},{k:'allergies',l:'רגישויות ואלרגיות',type:'textarea'},{k:'notes',l:'הערות',type:'textarea'}]},
  medications:{ title:'תרופה', fields:()=>[
    {k:'parent_id',l:'עבור',type:'select',opts:parentOpts(),req:1},{k:'name',l:'שם התרופה',req:1},{k:'dosage',l:'מינון',ph:'למשל: 5 מ"ג, כדור אחד'},
    {k:'times',l:'שעות נטילה (מופרדות בפסיק)',ph:'08:00, 20:00',dir:'ltr'},{k:'instructions',l:'הוראות',ph:'אחרי אוכל, עם מים'},
    {k:'stock_qty',l:'כמות במלאי (כדורים)',type:'number'},{k:'prescription_expiry',l:'תוקף מרשם',type:'date'},
    {k:'active',l:'פעילה',type:'checkbox'},{k:'notes',l:'הערות',type:'textarea'}]},
  appointments:{ title:'תור', fields:()=>[
    {k:'parent_id',l:'עבור',type:'select',opts:parentOpts(),req:1},{k:'title',l:'סוג התור',req:1,ph:'קרדיולוג, בדיקת דם…'},
    {k:'starts_at',l:'מועד',type:'datetime-local',req:1},{k:'doctor',l:'רופא/ה'},{k:'location',l:'מקום'},
    {k:'escort_user_id',l:'מי מלווה',type:'select',opts:memberOpts()},
    {k:'status',l:'סטטוס',type:'select',opts:[{v:'planned',t:'מתוכנן'},{v:'done',t:'התקיים'},{v:'cancelled',t:'בוטל'}]},
    {k:'summary',l:'סיכום אחרי התור',type:'textarea'},{k:'notes',l:'הערות / מה להביא',type:'textarea'}]},
  tasks:{ title:'משימה', fields:()=>[
    {k:'title',l:'מה צריך לעשות',req:1},{k:'category',l:'קטגוריה',type:'select',opts:['','קניות','בית','בירוקרטיה','ביקור','רפואי','כספים','אחר'].map(v=>({v,t:v||'—'}))},
    {k:'parent_id',l:'עבור',type:'select',opts:parentOpts(true)},{k:'assignee_id',l:'אחראי/ת',type:'select',opts:memberOpts()},
    {k:'due_date',l:'עד תאריך',type:'date'},{k:'description',l:'פירוט',type:'textarea'}]},
  contacts:{ title:'איש קשר', fields:()=>[
    {k:'name',l:'שם',req:1},{k:'category',l:'סוג',type:'select',opts:['','רופא/ה','קופת חולים','בית מרקחת','מטפל/ת','שכנים','ביטוח','חירום','אחר'].map(v=>({v,t:v||'—'}))},
    {k:'parent_id',l:'עבור',type:'select',opts:parentOpts(true)},{k:'phone',l:'טלפון',dir:'ltr'},{k:'email',l:'אימייל',dir:'ltr'},{k:'address',l:'כתובת'},{k:'notes',l:'הערות',type:'textarea'}]},
};
function fieldHtml(f, val){
  const id='f_'+f.k, ph=f.ph?` placeholder="${esc(f.ph)}"`:'', dir=f.dir?` dir="${f.dir}"`:'', req=f.req?' required':'';
  if(f.type==='select') return `<label for="${id}">${f.l}</label><select id="${id}"${req}>${f.opts.map(o=>`<option value="${esc(o.v)}"${String(val??'')===String(o.v)?' selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
  if(f.type==='textarea') return `<label for="${id}">${f.l}</label><textarea id="${id}"${ph}>${esc(val)}</textarea>`;
  if(f.type==='checkbox') return `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="${id}"${val!==false?' checked':''}> ${f.l}</label>`;
  return `<label for="${id}">${f.l}</label><input id="${id}" type="${f.type||'text'}" value="${esc(val)}"${ph}${dir}${req}>`;
}
function toInput(f,v){
  if(v==null) return '';
  if(f.type==='datetime-local'){ const d=new Date(v); return `${localDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  if(f.k==='times' && Array.isArray(v)) return v.join(', ');
  return v;
}
function fromInput(f){
  const el=$('#f_'+f.k);
  if(f.type==='checkbox') return el.checked;
  const v=el.value.trim();
  if(f.k==='times') return v ? v.split(/[,\s]+/).filter(Boolean).map(t=>{const [h,m='00']=t.split(':');return `${pad(+h)}:${pad(+m)}`;}).sort() : [];
  if(v==='') return null;
  if(f.type==='number') return Number(v);
  if(f.type==='datetime-local') return new Date(v).toISOString();
  return v;
}
function openModal(html){ $('#modalCard').innerHTML=html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }
$('#modal').onclick = e => { if(e.target.id==='modal') closeModal(); };
function editEntity(table, row={}, defaults={}){
  const E=ENT[table], fields=E.fields(), data={...defaults,...row};
  if(table!=='parents' && !S.parents.length){ toast('קודם מוסיפים הורה בלשונית "המשפחה"'); return; }
  openModal(`<h2>${row.id?'עריכת':'הוספת'} ${E.title}</h2><form id="entForm">${fields.map(f=>fieldHtml(f,toInput(f,data[f.k]))).join('')}
    <div class="foot"><button class="btn">שמירה</button><button type="button" class="btn sec" id="mCancel">ביטול</button>
    ${row.id?`<button type="button" class="btn danger" id="mDel" style="margin-inline-start:auto">מחיקה</button>`:''}</div></form>`);
  $('#mCancel').onclick=closeModal;
  if(row.id) $('#mDel').onclick=async()=>{ if(!confirm('למחוק?')) return; const {error}=await sb.from(table).delete().eq('id',row.id); if(error) return toast(errText(error)); closeModal(); toast('נמחק'); refresh(); };
  $('#entForm').onsubmit=async e=>{
    e.preventDefault(); const rec={}; fields.forEach(f=>rec[f.k]=fromInput(f));
    let res;
    if(row.id) res=await sb.from(table).update(rec).eq('id',row.id);
    else res=await sb.from(table).insert({...rec,family_id:S.family.id});
    if(res.error) return toast(errText(res.error));
    closeModal(); toast('נשמר'); refresh();
  };
}
window.editById = (table, id) => { const key={medications:'meds',appointments:'appts'}[table]||table; editEntity(table, S[key].find(x=>x.id===id)); };
window.addNew = (table, extra={}) => editEntity(table, {}, {parent_id: S.parent!=='all'?S.parent:(table==='tasks'||table==='contacts'?'':S.parents[0]?.id), active:true, status: table==='appointments'?'planned':undefined, ...extra});

// ---------- actions ----------
window.toggleDose = async (medId, time, logId) => {
  if(logId){ const {error}=await sb.from('medication_logs').delete().eq('id',logId); if(error) return toast(errText(error)); }
  else{
    const {error}=await sb.from('medication_logs').insert({family_id:S.family.id,medication_id:medId,scheduled_date:localDate(),scheduled_time:time,status:'taken'});
    if(error) return toast(errText(error));
    const m=S.meds.find(x=>x.id===medId); if(m && m.stock_qty>0) await sb.from('medications').update({stock_qty:m.stock_qty-1}).eq('id',medId);
  }
  refresh();
};
window.toggleTask = async (id, done) => { const {error}=await sb.from('tasks').update({status:done?'done':'open',completed_at:done?new Date().toISOString():null}).eq('id',id); if(error) return toast(errText(error)); refresh(); };
window.takeTask = async id => { const {error}=await sb.from('tasks').update({assignee_id:S.user.id}).eq('id',id); if(error) return toast(errText(error)); toast('המשימה עליך 💪'); refresh(); };
window.escortMe = async id => { const {error}=await sb.from('appointments').update({escort_user_id:S.user.id}).eq('id',id); if(error) return toast(errText(error)); toast('נרשמת כמלווה'); refresh(); };
window.setFilter = (k,v) => { S[k]=v; render(); };

// ---------- views ----------
function render(){ const m=$('#main'); m.innerHTML = ({today:vToday,meds:vMeds,appts:vAppts,tasks:vTasks,contacts:vContacts,docs:vDocs,family:vFamily})[S.tab](); if(S.tab==='docs') wireDocs(); if(S.tab==='family') wireFamily(); }
const empty = (t, btn='') => `<div class="empty">${t}${btn?`<div style="margin-top:12px">${btn}</div>`:''}</div>`;

function todayDoses(){
  const today=localDate(), out=[];
  byParent(S.meds).filter(m=>m.active).forEach(m=>(m.times||[]).forEach(t=>{
    const log=S.logs.find(l=>l.medication_id===m.id&&l.scheduled_date===today&&l.scheduled_time===t);
    out.push({m,t,log});
  }));
  return out.sort((a,b)=>a.t.localeCompare(b.t));
}
function alerts(){
  const a=[];
  byParent(S.meds).filter(m=>m.active).forEach(m=>{
    if(m.stock_qty!=null && m.stock_qty <= Math.max(7,(m.times||[]).length*7)) a.push({k:'warn',t:`נשארו ${m.stock_qty} כדורים של ${m.name} (${parentName(m.parent_id)})`});
    if(m.prescription_expiry){ const d=daysUntil(m.prescription_expiry); if(d<=30) a.push({k:d<0?'bad':'warn',t:`מרשם ${m.name} ${d<0?'פג':'יפוג בעוד '+d+' ימים'} (${parentName(m.parent_id)})`}); }
  });
  byParent(S.tasks).filter(t=>t.status==='open'&&t.due_date&&daysUntil(t.due_date)<0).forEach(t=>a.push({k:'bad',t:`משימה באיחור: ${t.title}`}));
  return a;
}
function doseLine({m,t,log}){
  const by = log ? `<span class="small muted">✓ ${esc(memberName(log.logged_by)||'')} ${new Date(log.logged_at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>` : '';
  return `<div class="line ${log?'done':''}"><div><b dir="ltr">${t}</b> · ${esc(m.name)} ${m.dosage?`<span class="muted">(${esc(m.dosage)})</span>`:''}<div class="small muted">${esc(parentName(m.parent_id))}${m.instructions?' · '+esc(m.instructions):''}</div>${by}</div>
    <button class="btn sm ${log?'sec':'okb'}" onclick="toggleDose('${m.id}','${t}',${log?`'${log.id}'`:'null'})">${log?'ביטול':'ניטל ✓'}</button></div>`;
}
function apptCard(a){
  const st={planned:['מתוכנן',''],done:['התקיים','ok'],cancelled:['בוטל','bad']}[a.status];
  return `<div class="item"><div class="row"><div class="title">${esc(a.title)}</div><span class="pill ${st[1]}">${st[0]}</span></div>
    <div>📅 ${fmtDT(a.starts_at)}</div><div class="small muted">${esc(parentName(a.parent_id))}${a.doctor?' · '+esc(a.doctor):''}${a.location?' · 📍 '+esc(a.location):''}</div>
    <div class="small">🚗 מלווה: ${a.escort_user_id?`<b>${esc(memberName(a.escort_user_id))}</b>`:`<span class="pill warn">אין מלווה</span>`}</div>
    ${a.notes?`<div class="small muted">📝 ${esc(a.notes)}</div>`:''}${a.summary?`<div class="small">📋 <b>סיכום:</b> ${esc(a.summary)}</div>`:''}
    <div class="acts">${!a.escort_user_id&&a.status==='planned'?`<button class="btn sm okb" onclick="escortMe('${a.id}')">אני מלווה</button>`:''}<button class="btn sm sec" onclick="editById('appointments','${a.id}')">${a.status==='planned'&&new Date(a.starts_at)<new Date()?'הוספת סיכום':'עריכה'}</button></div></div>`;
}
function taskLine(t){
  const late=t.status==='open'&&t.due_date&&daysUntil(t.due_date)<0;
  return `<div class="line ${t.status==='done'?'done':''}"><div style="display:flex;gap:10px;align-items:flex-start">
    <input type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask('${t.id}',this.checked)" style="margin-top:4px">
    <div><b>${esc(t.title)}</b> ${t.category?`<span class="pill">${esc(t.category)}</span>`:''}
    <div class="small muted">${t.assignee_id?'👤 '+esc(memberName(t.assignee_id)):'<span class="pill warn">לא משויך</span>'}${t.parent_id?' · '+esc(parentName(t.parent_id)):''}${t.due_date?` · <span class="${late?'pill bad':''}">עד ${fmtDate(t.due_date)}</span>`:''}</div>
    ${t.description?`<div class="small muted">${esc(t.description)}</div>`:''}</div></div>
    <div style="display:flex;gap:6px">${!t.assignee_id&&t.status==='open'?`<button class="btn sm okb" onclick="takeTask('${t.id}')">אני לוקח/ת</button>`:''}<button class="btn sm sec" onclick="editById('tasks','${t.id}')">עריכה</button></div></div>`;
}

function vToday(){
  if(!S.parents.length) return `<div class="card">${empty('👋 נתחיל בהוספת ההורים שאתם מטפלים בהם',`<button class="btn" onclick="addNew('parents')">+ הוספת הורה</button>`)}</div>`;
  const doses=todayDoses(), taken=doses.filter(d=>d.log).length;
  const now=new Date(), week=new Date(Date.now()+7*864e5);
  const upcoming=byParent(S.appts).filter(a=>a.status==='planned'&&new Date(a.starts_at)>=new Date(now-3*36e5)&&new Date(a.starts_at)<=week);
  const myTasks=byParent(S.tasks).filter(t=>t.status==='open'&&(t.assignee_id===S.user.id||!t.assignee_id));
  const al=alerts();
  return `<div class="grid g3" style="margin-bottom:16px">
    <div class="card stat"><span class="muted">תרופות היום</span><b>${taken}/${doses.length}</b><span class="small muted">מנות שנלקחו</span></div>
    <div class="card stat"><span class="muted">תורים השבוע</span><b>${upcoming.length}</b><span class="small muted">${upcoming.filter(a=>!a.escort_user_id).length} בלי מלווה</span></div>
    <div class="card stat"><span class="muted">משימות פתוחות</span><b>${byParent(S.tasks).filter(t=>t.status==='open').length}</b><span class="small muted">${myTasks.filter(t=>t.assignee_id===S.user.id).length} שלך</span></div>
  </div>
  ${al.length?`<div class="card" style="margin-bottom:16px"><h3>⚠️ דורש תשומת לב</h3><div class="list">${al.map(x=>`<div class="line"><span>${esc(x.t)}</span><span class="pill ${x.k}">${x.k==='bad'?'דחוף':'בקרוב'}</span></div>`).join('')}</div></div>`:''}
  <div class="grid g2">
    <div class="card"><h3>💊 תרופות להיום</h3><div class="list">${doses.map(doseLine).join('')||empty('אין תרופות מתוזמנות')}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><h3>📅 תורים בשבוע הקרוב</h3><div class="list">${upcoming.map(apptCard).join('')||empty('אין תורים השבוע')}</div></div>
      <div class="card"><h3>✅ המשימות שלי ופנויות</h3><div class="list">${myTasks.slice(0,8).map(taskLine).join('')||empty('אין משימות פתוחות 🎉')}</div></div>
    </div>
  </div>`;
}

function vMeds(){
  const meds=byParent(S.meds);
  const card=m=>{
    const exp=m.prescription_expiry?daysUntil(m.prescription_expiry):null;
    return `<div class="item" style="${m.active?'':'opacity:.55'}"><div class="row"><div class="title">${esc(m.name)}</div>${m.active?'':'<span class="pill">הופסקה</span>'}</div>
      <div class="small muted">${esc(parentName(m.parent_id))}${m.dosage?' · '+esc(m.dosage):''}</div>
      <div>${(m.times||[]).map(t=>`<span class="pill" dir="ltr">${t}</span>`).join(' ')||'<span class="small muted">לפי הצורך</span>'}</div>
      ${m.instructions?`<div class="small">${esc(m.instructions)}</div>`:''}
      <div class="small">${m.stock_qty!=null?`📦 מלאי: <b>${m.stock_qty}</b>`:''} ${exp!=null?` · 🧾 מרשם עד ${fmtDate(m.prescription_expiry)} ${exp<=30?`<span class="pill ${exp<0?'bad':'warn'}">${exp<0?'פג':'מתחדש בקרוב'}</span>`:''}`:''}</div>
      <div class="acts"><button class="btn sm sec" onclick="editById('medications','${m.id}')">עריכה</button></div></div>`;
  };
  return `<div class="bar"><h2>תרופות</h2><button class="btn" onclick="addNew('medications')">+ תרופה</button></div>
    ${meds.length?`<div class="grid g3">${meds.sort((a,b)=>b.active-a.active).map(card).join('')}</div>`:`<div class="card">${empty('עוד לא הוספתם תרופות')}</div>`}
    <div class="card" style="margin-top:16px"><h3>היסטוריית נטילה – 7 ימים</h3>${medHistory()}</div>`;
}
function medHistory(){
  const meds=byParent(S.meds).filter(m=>m.active&&(m.times||[]).length); if(!meds.length) return empty('אין נתונים');
  const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return localDate(d);});
  const head=days.map(d=>`<th class="small muted" style="padding:6px">${new Date(d+'T00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric'})}</th>`).join('');
  const rows=meds.map(m=>`<tr><td style="padding:6px"><b>${esc(m.name)}</b><div class="small muted">${esc(parentName(m.parent_id))}</div></td>${days.map(d=>{
    const n=S.logs.filter(l=>l.medication_id===m.id&&l.scheduled_date===d).length, tot=m.times.length;
    const cls=n>=tot?'ok':n>0?'warn':(d===localDate()?'':'bad');
    return `<td style="text-align:center"><span class="pill ${cls}">${n}/${tot}</span></td>`;}).join('')}</tr>`).join('');
  return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><tr><th></th>${head}</tr>${rows}</table></div>`;
}

function vAppts(){
  const now=new Date(); let list=byParent(S.appts);
  if(S.apptFilter==='upcoming') list=list.filter(a=>a.status==='planned');
  else if(S.apptFilter==='past') list=list.filter(a=>a.status!=='planned').reverse();
  const f=(k,t)=>`<button class="chip ${S.apptFilter===k?'on':''}" onclick="setFilter('apptFilter','${k}')">${t}</button>`;
  return `<div class="bar"><h2>תורים ובדיקות</h2><div class="filters">${f('upcoming','מתוכננים')}${f('past','היסטוריה')}${f('all','הכל')}</div><button class="btn" onclick="addNew('appointments')">+ תור</button></div>
    ${list.length?`<div class="grid g3">${list.map(apptCard).join('')}</div>`:`<div class="card">${empty('אין תורים להצגה')}</div>`}`;
}

function vTasks(){
  let list=byParent(S.tasks);
  if(S.taskFilter==='open') list=list.filter(t=>t.status==='open');
  if(S.taskFilter==='mine') list=list.filter(t=>t.status==='open'&&t.assignee_id===S.user.id);
  if(S.taskFilter==='done') list=list.filter(t=>t.status==='done');
  list.sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999'));
  const f=(k,t)=>`<button class="chip ${S.taskFilter===k?'on':''}" onclick="setFilter('taskFilter','${k}')">${t}</button>`;
  const load=S.members.map(m=>({n:m.display_name,c:S.tasks.filter(t=>t.status==='open'&&t.assignee_id===m.user_id).length}));
  return `<div class="bar"><h2>משימות וחלוקה</h2><div class="filters">${f('open','פתוחות')}${f('mine','שלי')}${f('done','הושלמו')}${f('all','הכל')}</div><button class="btn" onclick="addNew('tasks')">+ משימה</button></div>
    <div class="card" style="margin-bottom:16px"><h3>חלוקת עומס</h3><div class="filters">${load.map(x=>`<span class="chip">${esc(x.n)}: <b>${x.c}</b></span>`).join('')}</div></div>
    <div class="card"><div class="list">${list.map(taskLine).join('')||empty('אין משימות')}</div></div>`;
}

function vContacts(){
  const list=S.parent==='all'?S.contacts:S.contacts.filter(c=>!c.parent_id||c.parent_id===S.parent);
  const card=c=>`<div class="item"><div class="row"><div class="title">${esc(c.name)}</div>${c.category?`<span class="pill">${esc(c.category)}</span>`:''}</div>
    ${c.parent_id?`<div class="small muted">${esc(parentName(c.parent_id))}</div>`:''}
    ${c.phone?`<div>📞 <a href="tel:${esc(c.phone)}" dir="ltr">${esc(c.phone)}</a></div>`:''}${c.email?`<div>✉️ <a href="mailto:${esc(c.email)}" dir="ltr">${esc(c.email)}</a></div>`:''}
    ${c.address?`<div class="small">📍 ${esc(c.address)}</div>`:''}${c.notes?`<div class="small muted">${esc(c.notes)}</div>`:''}
    <div class="acts"><button class="btn sm sec" onclick="editById('contacts','${c.id}')">עריכה</button></div></div>`;
  return `<div class="bar"><h2>אנשי קשר</h2><button class="btn" onclick="addNew('contacts')">+ איש קשר</button></div>
    ${list.length?`<div class="grid g3">${list.map(card).join('')}</div>`:`<div class="card">${empty('עוד אין אנשי קשר — רופא משפחה, בית מרקחת, מטפלת…')}</div>`}`;
}

function vDocs(){
  const list=S.parent==='all'?S.docs:S.docs.filter(d=>!d.parent_id||d.parent_id===S.parent);
  return `<div class="bar"><h2>מסמכים</h2><button class="btn" id="docAdd">+ העלאת מסמך</button></div>
    <div class="card"><div class="list">${list.map(d=>`<div class="line"><div><b>📄 ${esc(d.title)}</b> ${d.category?`<span class="pill">${esc(d.category)}</span>`:''}
      <div class="small muted">${d.parent_id?esc(parentName(d.parent_id))+' · ':''}${d.doc_date?fmtDate(d.doc_date)+' · ':''}הועלה ע"י ${esc(memberName(d.uploaded_by))}</div></div>
      <div style="display:flex;gap:6px"><button class="btn sm sec" data-open="${d.id}">פתיחה</button><button class="btn sm danger" data-del="${d.id}">מחיקה</button></div></div>`).join('')||empty('סיכומי ביקור, הפניות, תוצאות בדיקות, ייפוי כוח…')}</div></div>`;
}
function wireDocs(){
  $('#docAdd').onclick=()=>{
    if(!S.parents.length) return toast('קודם מוסיפים הורה');
    openModal(`<h2>העלאת מסמך</h2><form id="docForm">
      <label>קובץ</label><input type="file" id="dFile" required>
      <label>כותרת</label><input id="dTitle" required>
      <div class="two"><div>${fieldHtml({k:'cat',l:'סוג',type:'select',opts:['','סיכום ביקור','הפניה','תוצאות בדיקה','מרשם','משפטי','ביטוח','אחר'].map(v=>({v,t:v||'—'}))},'')}</div>
      <div>${fieldHtml({k:'par',l:'עבור',type:'select',opts:parentOpts(true)},S.parent!=='all'?S.parent:'')}</div></div>
      <label>תאריך המסמך</label><input type="date" id="dDate">
      <div class="foot"><button class="btn" id="dBtn">העלאה</button><button type="button" class="btn sec" onclick="closeModal()">ביטול</button></div></form>`);
    $('#dFile').onchange=e=>{ if(!$('#dTitle').value) $('#dTitle').value=e.target.files[0]?.name.replace(/\.[^.]+$/,'')||''; };
    $('#docForm').onsubmit=async e=>{
      e.preventDefault(); const file=$('#dFile').files[0]; if(!file) return;
      $('#dBtn').disabled=true; $('#dBtn').textContent='מעלה…';
      const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
      const path=`${S.family.id}/${crypto.randomUUID()}.${ext}`;
      const up=await sb.storage.from('documents').upload(path,file,{contentType:file.type||undefined});
      if(up.error){ $('#dBtn').disabled=false; $('#dBtn').textContent='העלאה'; return toast(errText(up.error)); }
      const {error}=await sb.from('documents').insert({family_id:S.family.id,title:$('#dTitle').value.trim(),category:$('#f_cat').value||null,parent_id:$('#f_par').value||null,doc_date:$('#dDate').value||null,storage_path:path,file_name:file.name});
      if(error) return toast(errText(error));
      closeModal(); toast('המסמך הועלה'); refresh();
    };
  };
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{
    const d=S.docs.find(x=>x.id===b.dataset.open);
    const {data,error}=await sb.storage.from('documents').createSignedUrl(d.storage_path,300);
    if(error) return toast(errText(error)); window.open(data.signedUrl,'_blank');
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('למחוק את המסמך?')) return; const d=S.docs.find(x=>x.id===b.dataset.del);
    await sb.storage.from('documents').remove([d.storage_path]);
    const {error}=await sb.from('documents').delete().eq('id',d.id); if(error) return toast(errText(error));
    toast('נמחק'); refresh();
  });
}

function vFamily(){
  const age=b=>b?Math.floor((Date.now()-new Date(b))/31557600000):null;
  return `<div class="grid g2">
    <div class="card"><div class="bar"><h2>ההורים</h2><button class="btn" onclick="addNew('parents')">+ הורה</button></div>
      <div class="list">${S.parents.map(p=>`<div class="item"><div class="row"><div class="title">${esc(p.full_name)}</div>${p.hmo?`<span class="pill">${esc(p.hmo)}</span>`:''}</div>
        ${p.birth_date?`<div class="small muted">גיל ${age(p.birth_date)} · נולד/ה ${fmtDate(p.birth_date)}</div>`:''}
        ${p.conditions?`<div class="small"><b>מצבים רפואיים:</b> ${esc(p.conditions)}</div>`:''}
        ${p.allergies?`<div class="small"><span class="pill bad">רגישויות</span> ${esc(p.allergies)}</div>`:''}
        ${p.notes?`<div class="small muted">${esc(p.notes)}</div>`:''}
        <div class="acts"><button class="btn sm sec" onclick="editById('parents','${p.id}')">עריכה</button></div></div>`).join('')||empty('עוד לא הוספתם הורים')}</div></div>
    <div class="card"><h2>בני המשפחה</h2>
      <div class="list">${S.members.map(m=>`<div class="line"><div><b>${esc(m.display_name)}</b>${m.user_id===S.user.id?' <span class="muted small">(את/ה)</span>':''}${m.phone?`<div class="small muted" dir="ltr">${esc(m.phone)}</div>`:''}</div>${m.role==='admin'?'<span class="pill">מנהל/ת</span>':''}</div>`).join('')}</div>
      <h3 style="margin-top:20px">הזמנת אחים ואחיות</h3>
      <div class="small muted" style="margin-bottom:8px">שלחו להם את הקישור לאפליקציה ואת הקוד הזה. אחרי הרשמה הם בוחרים "הצטרפות בקוד".</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="code">${esc(S.family.invite_code)}</span><button class="btn sm sec" id="copyCode">העתקה</button></div>
      <h3 style="margin-top:20px">הפרטים שלי</h3>
      <form id="meForm"><div class="two"><div><label>שם תצוגה</label><input id="meN" value="${esc(S.me.display_name)}"></div><div><label>טלפון</label><input id="meP" dir="ltr" value="${esc(S.members.find(m=>m.user_id===S.user.id)?.phone)}"></div></div>
      <div class="foot"><button class="btn sm">שמירה</button></div></form>
    </div></div>`;
}
function wireFamily(){
  $('#copyCode').onclick=()=>{ navigator.clipboard?.writeText(S.family.invite_code); toast('הקוד הועתק'); };
  $('#meForm').onsubmit=async e=>{ e.preventDefault();
    const {error}=await sb.from('family_members').update({display_name:$('#meN').value.trim()||S.me.display_name,phone:$('#meP').value.trim()||null}).eq('family_id',S.family.id).eq('user_id',S.user.id);
    if(error) return toast(errText(error)); S.me.display_name=$('#meN').value.trim(); $('#meName').textContent='· '+S.me.display_name; toast('נשמר'); refresh(); };
}

// ---------- start ----------
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT') setTimeout(boot,0); });
boot();
</script>
</body>
</html>
